<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Saved Trips — MakeMyVacation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-stone-50 text-stone-900 min-h-screen flex flex-col justify-between">

  <header class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-stone-200">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-xl bg-emerald-700 text-white flex items-center justify-center font-extrabold text-sm">MV</div>
        <span class="font-extrabold text-xl tracking-tight text-stone-900">MakeMy<span class="text-emerald-700">Vacation</span></span>
      </a>
      <nav class="flex items-center gap-6 text-sm font-semibold text-stone-600">
        <a href="destinations.html" class="hover:text-emerald-700 transition">Destinations</a>
        <a href="resorts.html" class="hover:text-emerald-700 transition">Explore Resorts</a>
        <a href="my-trips.html" class="text-emerald-700">My Trips</a>
      </nav>
    </div>
  </header>

  <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8 space-y-6">
    <div>
      <h1 class="text-3xl font-extrabold text-stone-900">My Saved Vacations</h1>
      <p class="text-stone-500 text-sm mt-1">Review previously planned itineraries and booking details</p>
    </div>

    <div id="saved-trips-container" class="space-y-4"></div>
  </main>

  <footer class="border-t border-stone-200 bg-white py-6 text-center text-xs text-stone-400">
    © MakeMyVacation. AI-Powered Vacation Planning & Resort Discovery Platform.
  </footer>

  <script src="js/store.js"></script>
  <script>
    function renderSavedTrips() {
      const list = window.MMV.getSavedTrips();
      const container = document.getElementById('saved-trips-container');

      if (list.length === 0) {
        container.innerHTML = `
          <div class="bg-white border border-stone-200 rounded-3xl p-12 text-center space-y-4 shadow-sm">
            <div class="text-4xl">🏝️</div>
            <h3 class="text-lg font-bold text-stone-900">No saved trips yet</h3>
            <p class="text-stone-500 text-xs sm:text-sm max-w-sm mx-auto">Use our AI conversational planner to build and save customized itineraries for your next holiday.</p>
            <a href="index.html" class="inline-block px-5 py-2.5 bg-emerald-700 text-white text-xs font-bold rounded-xl hover:bg-emerald-800 transition">
              Plan A Trip Now ✨
            </a>
          </div>
        `;
        return;
      }

      container.innerHTML = list.map(t => `
        <div class="bg-white border border-stone-200 rounded-3xl p-6 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
          <div class="flex items-center gap-4">
            <img src="${t.resortImage}" class="w-20 h-20 rounded-2xl object-cover" alt="${t.resortName}">
            <div>
              <span class="text-xs font-semibold text-emerald-700 uppercase tracking-wide">${t.destination} • ${t.durationNights} Nights</span>
              <h3 class="font-bold text-lg text-stone-900">${t.resortName}</h3>
              <p class="text-xs text-stone-500">Party: ${t.adults} Adults • ${t.rooms} Room(s) • Saved: ${t.savedAt}</p>
            </div>
          </div>
          <div class="flex sm:flex-col items-center sm:items-end justify-between w-full sm:w-auto gap-3 pt-3 sm:pt-0 border-t sm:border-0 border-stone-100">
            <span class="text-xl font-black text-emerald-700">₹${t.totalCost.toLocaleString()}</span>
            <div class="flex gap-2">
              <button onclick="deleteTrip('${t.id}')" class="text-xs text-red-600 hover:text-red-800 font-semibold px-3 py-1.5 rounded-lg border border-red-200 hover:bg-red-50 transition">
                Remove
              </button>
              <a href="index.html" class="text-xs bg-stone-900 text-white font-semibold px-3.5 py-1.5 rounded-lg hover:bg-stone-800 transition">
                Re-Plan
              </a>
            </div>
          </div>
        </div>
      `).join('');
    }

    function deleteTrip(id) {
      if (confirm('Are you sure you want to remove this saved vacation?')) {
        window.MMV.deleteTrip(id);
        renderSavedTrips();
      }
    }

    document.addEventListener('DOMContentLoaded', renderSavedTrips);
  </script>
</body>
</html>
