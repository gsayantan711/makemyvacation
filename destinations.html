<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Destinations — MakeMyVacation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-stone-50 text-stone-900 min-h-screen flex flex-col justify-between">

  <header class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-stone-200">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-xl bg-emerald-700 text-white flex items-center justify-center font-extrabold text-sm">MV</div>
        <span class="font-extrabold text-xl tracking-tight text-stone-900">MakeMy<span class="text-emerald-700">Vacation</span></span>
      </a>
      <nav class="flex items-center gap-6 text-sm font-semibold text-stone-600">
        <a href="destinations.html" class="text-emerald-700">Destinations</a>
        <a href="resorts.html" class="hover:text-emerald-700 transition">Explore Resorts</a>
        <a href="my-trips.html" class="hover:text-emerald-700 transition">My Trips</a>
      </nav>
    </div>
  </header>

  <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-8 space-y-8">
    <div>
      <h1 class="text-3xl font-extrabold text-stone-900">Explore Bengal Destinations</h1>
      <p class="text-stone-500 text-sm mt-1">Discover protected rainforests, river valleys, and peaceful beaches</p>
    </div>

    <div id="destinations-list" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
  </main>

  <footer class="border-t border-stone-200 bg-white py-6 text-center text-xs text-stone-400">
    © MakeMyVacation. AI-Powered Vacation Planning & Resort Discovery Platform.
  </footer>

  <script src="js/store.js"></script>
  <script>
    function renderDestinations() {
      const dests = window.MMV.getDestinations();
      document.getElementById('destinations-list').innerHTML = dests.map(d => `
        <div class="bg-white border border-stone-200 rounded-3xl overflow-hidden shadow-sm hover:shadow-md transition flex flex-col justify-between">
          <div>
            <div class="h-64 relative overflow-hidden">
              <img src="${d.image}" class="w-full h-full object-cover" alt="${d.name}">
              <div class="absolute top-3 left-3 bg-black/60 backdrop-blur-md text-white px-3 py-1 rounded-full text-xs font-semibold">
                ⭐ Top Rated Circuit
              </div>
            </div>
            <div class="p-6 space-y-4">
              <div>
                <h2 class="text-2xl font-bold text-stone-900">${d.name}</h2>
                <p class="text-xs font-semibold text-emerald-700 mt-0.5">${d.tagline}</p>
              </div>
              <p class="text-stone-600 text-sm leading-relaxed">${d.description}</p>
              <div class="text-xs text-stone-500 space-y-1 bg-stone-50 p-3.5 rounded-2xl border border-stone-100">
                <p><strong>📅 Best Time:</strong> ${d.bestTime}</p>
                <p><strong>🚆 Transit:</strong> ${d.howToReach}</p>
                <p><strong>🏞️ Key Attractions:</strong> ${d.attractions.join(', ')}</p>
              </div>
            </div>
          </div>
          <div class="p-6 pt-0">
            <a href="index.html" class="block w-full text-center py-3 bg-emerald-700 hover:bg-emerald-800 text-white font-bold rounded-xl transition shadow-sm text-sm">
              Plan Vacation in ${d.name} with AI ✨
            </a>
          </div>
        </div>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', renderDestinations);
  </script>
</body>
</html>
